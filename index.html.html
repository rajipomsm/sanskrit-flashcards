<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>अव्यय, शब्दसङ्ग्रह एवं धातुसङ्ग्रह — Flashcards</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tiro+Devanagari+Sanskrit&family=Noto+Sans+Gujarati:wght@400;600&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --paper: #EDE3CE;
    --paper-dark: #E0D2AE;
    --paper-edge: #D8C69C;
    --ink: #2A2015;
    --ink-soft: #574A38;
    --maroon: #7C2331;
    --maroon-soft: #9A4152;
    --teal: #1E4A42;
    --gold: #A97B1F;
    --thread: #B99B57;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper-dark);
    color: var(--ink);
    font-family: 'Crimson Pro', serif;
    min-height: 100vh;
  }

  body {
    background-image:
      radial-gradient(circle at 15% 20%, rgba(122,35,49,0.05), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(30,74,66,0.06), transparent 45%),
      repeating-linear-gradient(0deg, rgba(90,70,40,0.025) 0px, rgba(90,70,40,0.025) 1px, transparent 1px, transparent 3px);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px 60px;
  }

  .wrap { width: 100%; max-width: 640px; }

  header {
    text-align: center;
    margin-bottom: 22px;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--maroon);
    margin-bottom: 6px;
  }

  h1 {
    font-family: 'Tiro Devanagari Sanskrit', serif;
    font-size: 42px;
    margin: 0 0 2px;
    color: var(--ink);
    font-weight: 400;
  }

  .subtitle {
    font-style: italic;
    color: var(--ink-soft);
    font-size: 15px;
  }

  .brush-rule {
    width: 140px;
    height: 6px;
    margin: 14px auto 0;
    background: linear-gradient(90deg, transparent, var(--maroon) 20%, var(--gold) 50%, var(--maroon) 80%, transparent);
    -webkit-mask: linear-gradient(90deg, transparent, black 15%, black 85%, transparent);
    mask: linear-gradient(90deg, transparent, black 15%, black 85%, transparent);
    opacity: 0.8;
    border-radius: 3px;
  }

  /* Deck selector */
  .decks {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin: 22px 0 18px;
  }

  .deck-chip {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.03em;
    padding: 7px 13px;
    border: 1px solid var(--paper-edge);
    background: var(--paper);
    color: var(--ink-soft);
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .deck-chip:hover { border-color: var(--maroon-soft); color: var(--maroon); }
  .deck-chip.active {
    background: var(--maroon);
    border-color: var(--maroon);
    color: var(--paper);
  }

  /* Progress */
  .progress-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 10px;
    padding: 0 4px;
  }
  .progress-track {
    height: 3px;
    background: var(--paper-edge);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--maroon), var(--gold));
    transition: width 0.25s ease;
  }

  /* Card */
  .stage {
    perspective: 1400px;
    margin-bottom: 22px;
  }

  .card {
    position: relative;
    width: 100%;
    height: 300px;
    cursor: pointer;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(.4,.2,.2,1);
  }
  .card.flipped { transform: rotateY(180deg); }

  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    border-radius: 4px;
    background: var(--paper);
    border: 1px solid var(--paper-edge);
    box-shadow: 0 8px 24px rgba(42,32,21,0.18), 0 1px 0 rgba(255,255,255,0.4) inset;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px;
    text-align: center;
    overflow: hidden;
  }

  /* stitched manuscript holes */
  .face::before, .face::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--paper-dark);
    box-shadow: inset 0 0 0 1px var(--thread), inset 0 2px 3px rgba(0,0,0,0.15);
    transform: translateY(-50%);
  }
  .face::before { left: 14px; }
  .face::after { right: 14px; }

  .face .deck-label {
    position: absolute;
    top: 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--ink-soft);
    opacity: 0.6;
  }

  .front .root {
    font-family: 'Tiro Devanagari Sanskrit', serif;
    font-size: 76px;
    color: var(--ink);
    line-height: 1;
  }
  .front .root-alt {
    font-family: 'Tiro Devanagari Sanskrit', serif;
    font-size: 24px;
    color: var(--maroon-soft);
    margin-top: 6px;
  }
  .front .hint {
    margin-top: 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    opacity: 0.55;
    letter-spacing: 0.05em;
  }

  .back { transform: rotateY(180deg); background: var(--paper); }
  .back .verb {
    font-family: 'Tiro Devanagari Sanskrit', serif;
    font-size: 40px;
    color: var(--teal);
    margin-bottom: 14px;
  }
  .back .guj {
    font-family: 'Noto Sans Gujarati', serif;
    font-size: 22px;
    color: var(--maroon);
    font-weight: 600;
    margin-bottom: 10px;
  }
  .back .eng {
    font-size: 22px;
    font-style: italic;
    color: var(--ink);
  }
  .back .divider {
    width: 40px;
    height: 2px;
    background: var(--thread);
    margin: 12px auto;
    opacity: 0.6;
  }

  /* Controls */
  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }

  .ctrl-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    padding: 10px 16px;
    background: var(--paper);
    border: 1px solid var(--paper-edge);
    color: var(--ink);
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .ctrl-btn:hover { border-color: var(--maroon-soft); color: var(--maroon); }
  .ctrl-btn:active { transform: translateY(1px); }
  .ctrl-btn.primary {
    background: var(--teal);
    border-color: var(--teal);
    color: var(--paper);
  }
  .ctrl-btn.primary:hover { background: var(--maroon); border-color: var(--maroon); color: var(--paper); }
  .ctrl-btn:disabled { opacity: 0.35; cursor: not-allowed; }

  .keys-hint {
    text-align: center;
    margin-top: 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-soft);
    opacity: 0.55;
    letter-spacing: 0.02em;
  }

  @media (max-width: 480px) {
    h1 { font-size: 34px; }
    .card { height: 270px; }
    .front .root { font-size: 60px; }
  }

  /* Audio pronunciation */
  .speak-btn {
    position: absolute;
    top: 10px;
    right: 12px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    border: 1px solid var(--paper-edge);
    background: var(--paper-dark);
    color: var(--maroon);
    font-size: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s ease;
    z-index: 2;
  }
  .speak-btn:hover { background: var(--maroon); color: var(--paper); border-color: var(--maroon); }
  .speak-btn:active { transform: scale(0.92); }
  .speak-btn.speaking { background: var(--teal); color: var(--paper); border-color: var(--teal); animation: pulse 0.8s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

  .ctrl-btn.audio-toggle.on { background: var(--gold); border-color: var(--gold); color: var(--ink); }

  .voice-note {
    text-align: center;
    margin-top: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--ink-soft);
    opacity: 0.5;
  }
</style>
</head>

        <div class="guj" id="gujText">આગળ</div>
        <div class="eng" id="engText">ahead / in front</div>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="ctrl-btn" id="prevBtn">← Prev</button>
    <button class="ctrl-btn primary" id="flipBtn">Flip</button>
    <button class="ctrl-btn" id="shuffleBtn">Shuffle</button>
    <button class="ctrl-btn" id="nextBtn">Next →</button>
    <button class="ctrl-btn audio-toggle" id="autoAudioBtn" title="Auto-pronounce on each card">🔈 Auto</button>
  </div>

  <div class="keys-hint">space / click to flip &nbsp;·&nbsp; ← → to navigate &nbsp;·&nbsp; s to shuffle &nbsp;·&nbsp; p to pronounce</div>
  <div class="voice-note" id="voiceNote"></div>
</div>

const deckKeys = Object.keys(DATA);
let currentDeckIdx = 0;
let order = [];
let cursor = 0;
let flipped = false;

const decksEl = document.getElementById('decks');
const deckNameEl = document.getElementById('deckName');
const progressTextEl = document.getElementById('progressText');
const progressFillEl = document.getElementById('progressFill');
const card = document.getElementById('card');
const frontLabel = document.getElementById('frontLabel');
const rootText = document.getElementById('rootText');
const rootAlt = document.getElementById('rootAlt');
const verbText = document.getElementById('verbText');
const verbDivider = document.getElementById('verbDivider');
const gujText = document.getElementById('gujText');
const engText = document.getElementById('engText');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const flipBtn = document.getElementById('flipBtn');
const shuffleBtn = document.getElementById('shuffleBtn');
const speakBtnFront = document.getElementById('speakBtnFront');
const speakBtnBack = document.getElementById('speakBtnBack');
const autoAudioBtn = document.getElementById('autoAudioBtn');
const voiceNote = document.getElementById('voiceNote');

// ---- Pronunciation (Web Speech API) ----
let currentSpeakText = '';
let autoAudio = false;
let voices = [];
let chosenVoice = null;

function pickVoice(){
  voices = window.speechSynthesis ? window.speechSynthesis.getVoices() : [];
  // Prefer Hindi (closest available match for Devanagari pronunciation), then Sanskrit if a browser ever exposes it.
  chosenVoice =
    voices.find(v => v.lang && v.lang.toLowerCase().startsWith('sa')) ||
    voices.find(v => v.lang && v.lang.toLowerCase().startsWith('hi')) ||
    voices.find(v => v.lang && v.lang.toLowerCase().includes('in')) ||
    voices[0] || null;

  if (voiceNote) {
    voiceNote.textContent = chosenVoice
      ? ('voice: ' + chosenVoice.name + ' (' + chosenVoice.lang + ')' + (chosenVoice.lang.toLowerCase().startsWith('hi') ? '' : ' — no Hindi/Sanskrit voice found, pronunciation may be rough'))
      : 'no speech voices available on this device/browser';
  }
}

if (window.speechSynthesis) {
  pickVoice();
  window.speechSynthesis.onvoiceschanged = pickVoice;
}

function speakText(text, btn){
  if (!window.speechSynthesis || !text) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  if (chosenVoice) utter.voice = chosenVoice;
  utter.lang = (chosenVoice && chosenVoice.lang) || 'hi-IN';
  utter.rate = 0.8;
  utter.pitch = 1;
  if (btn) {
    utter.onstart = () => btn.classList.add('speaking');
    utter.onend = () => btn.classList.remove('speaking');
    utter.onerror = () => btn.classList.remove('speaking');
  }
  window.speechSynthesis.speak(utter);
}

function speakCurrent(btn){
  speakText(currentSpeakText, btn);
}

function buildDecks(){
  decksEl.innerHTML = '';
  deckKeys.forEach((key, i) => {
    const chip = document.createElement('div');
    chip.className = 'deck-chip' + (i === currentDeckIdx ? ' active' : '');
    chip.textContent = key.startsWith('List ') ? key.replace('List ', 'L') : key;
    chip.title = key;
    chip.addEventListener('click', () => selectDeck(i));
    decksEl.appendChild(chip);
  });
}

function selectDeck(i){
  currentDeckIdx = i;
  order = DATA[deckKeys[i]].map((_, idx) => idx);
  cursor = 0;
  flipped = false;
  buildDecks();
  render();
}

function render(){
  const deckName = deckKeys[currentDeckIdx];
  const entries = DATA[deckName];
  const entry = entries[order[cursor]];
  const [root, alt, verb, guj, eng] = entry;

  card.classList.remove('flipped');
  flipped = false;

  deckNameEl.textContent = deckName;
  progressTextEl.textContent = (cursor + 1) + ' / ' + entries.length;
  progressFillEl.style.width = ((cursor + 1) / entries.length * 100) + '%';

  frontLabel.textContent = deckName;
  rootText.textContent = root;
  rootAlt.textContent = alt;
  rootAlt.style.display = alt ? '' : 'none';
  verbText.textContent = verb;
  verbText.style.display = verb ? '' : 'none';
  verbDivider.style.display = verb ? '' : 'none';
  gujText.textContent = guj;
  engText.textContent = eng;

  prevBtn.disabled = cursor === 0;
  nextBtn.disabled = cursor === entries.length - 1;

  // Prefer the conjugated verb form (e.g. गच्छति) when present, else the root/word itself.
  currentSpeakText = verb || root;
  if (autoAudio) speakCurrent(speakBtnFront);
}

function flip(){
  flipped = !flipped;
  card.classList.toggle('flipped', flipped);
}

function next(){
  const entries = DATA[deckKeys[currentDeckIdx]];
  if (cursor < entries.length - 1){
    cursor++;
    render();
  }
}

function prev(){
  if (cursor > 0){
    cursor--;
    render();
  }
}

function shuffle(){
  for (let i = order.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  cursor = 0;
  render();
}

card.addEventListener('click', flip);
flipBtn.addEventListener('click', flip);
prevBtn.addEventListener('click', prev);
nextBtn.addEventListener('click', next);
shuffleBtn.addEventListener('click', shuffle);

speakBtnFront.addEventListener('click', (e) => { e.stopPropagation(); speakCurrent(speakBtnFront); });
speakBtnBack.addEventListener('click', (e) => { e.stopPropagation(); speakCurrent(speakBtnBack); });

autoAudioBtn.addEventListener('click', () => {
  autoAudio = !autoAudio;
  autoAudioBtn.classList.toggle('on', autoAudio);
  autoAudioBtn.textContent = autoAudio ? '🔊 Auto: On' : '🔈 Auto';
  if (autoAudio) speakCurrent(speakBtnFront);
});

document.addEventListener('keydown', (e) => {
  if (e.code === 'Space'){ e.preventDefault(); flip(); }
  else if (e.code === 'ArrowRight'){ next(); }
  else if (e.code === 'ArrowLeft'){ prev(); }
  else if (e.key === 's' || e.key === 'S'){ shuffle(); }
  else if (e.key === 'p' || e.key === 'P'){ speakCurrent(flipped ? speakBtnBack : speakBtnFront); }
});

selectDeck(0);
